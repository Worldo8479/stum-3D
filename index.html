<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>File Viewer</title>
<style>
  body{font-family:sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;display:flex;flex-direction:column;align-items:center;background:#fafafa;}
  .modal{position:fixed;width:340px;z-index:1000;background:#fff;padding:2rem;border:1px solid #ccc;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  .modal h2{margin-top:0;}
  input[type=password]{width:100%;padding:0.5rem;margin-bottom:1rem;}
  button{background:#4a90e2;color:#fff;padding:0.6rem 1rem;border:none;border-radius:4px;cursor:pointer;}
  .content{margin-top:2rem;font-size:1.1rem;}
  canvas{display:block;width:100%;height:70vh;background:#ddd;}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
<script>
async function login() {
    const pw = prompt('Enter password');
    if(pw==='stum-4K7b2r'){
        document.getElementById('modal').style.display='none';
        displayStlViewer();
        displayUszdViewer();
    }
}
window.onload=login;

// ---------- STL viewer ----------
function createStlView() {
    const container = document.createElement('div');
    container.className = 'content';
    container.innerHTML = '<h2>STL Folder</h2>';
    const div = document.getElementById('stl-viewer').innerHTML = '';
    div.appendChild(container);
    return container;
}
function displayStlViewer() {
    const canvasDiv = createStlView();
    // placeholder cube
    const scene = new THREE.Scene();
    const cam   = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
    cam.position.set(4,6,8);
    const renderer = new THREE.WebGLRenderer({canvas: document.createElement('canvas'), antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // cube
    const geometry = new THREE.BoxGeometry(1,1,1);
    const material = new THREE.MeshStandardMaterial({color:0x2e7d32});
    const cube = new THREE.Mesh(geometry,material);
    scene.add(cube);
    camera = cam;
    renderer.render(scene,camera);

    window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);});
}
let camera = null;

function updateCube(){
    if(!camera) return;
    const cube = document.querySelector('.cube');
    const rotation = performance.now()*0.1;
    if(cube){
        cube.rotation.y = rotation;
        cube.rotation.x = 0;
    }
}
setInterval(updateCube,30);
</script>
</head>
<body id="modal">
<h2>Enter password</h2>
<input type="password" placeholder="Password"><br>
<button onclick="login()">OK</button>
<div id="content"></div>

<div style="text-align:center;margin-top:1rem;">
    <canvas id="stl-viewer"></canvas>
</div>
<div style="margin-top:40px;text-align:center;">
    <canvas id="uszd-viewer"></canvas>
</div>
</body>
</html>
